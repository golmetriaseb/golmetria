name: Actualizar datos
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/**', '.github/workflows/update.yml']
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar datos y calcular
        run: |
          python scripts/build.py > build_log.txt 2>&1 || echo "FALLO build.py" >> build_log.txt
          tail -c 6000 build_log.txt > build_log_short.txt; mv build_log_short.txt build_log.txt
      - name: Guardar resultados
        run: |
          git config user.name "Golmetria robot"
          git config user.email "robot@users.noreply.github.com"
          git add -f data.json backtest.json results.json build_log.txt espn_cache.json
          git diff --cached --quiet || git commit -m "Datos actualizados"
          git pull --rebase -X theirs -q || { git rebase --abort || true; git reset -q --hard origin/main; exit 0; }
          git push
