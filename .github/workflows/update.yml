name: Actualizar datos
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/**', '.github/workflows/update.yml']
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar datos y calcular
        run: python scripts/build.py
      - name: Guardar resultados
        run: |
          git config user.name "Golmetria robot"
          git config user.email "robot@users.noreply.github.com"
          git add data.json backtest.json
          git diff --cached --quiet || git commit -m "Datos actualizados"
          git pull --rebase -q || true
          git push
