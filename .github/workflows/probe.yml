name: Probar fuentes
on:
  push:
    paths: ['scripts/probe.py', '.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/probe.py
      - run: |
          git config user.name "Golmetria robot"
          git config user.email "robot@users.noreply.github.com"
          git add probe_out.txt
          git commit -m "Resultado de prueba de fuentes" || true
          git pull --rebase -q || true
          git push
